<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
       background:#fff; color:#020817; -webkit-font-smoothing:antialiased; }
.wrap { padding:56px 56px 44px; }
.cols { display:flex; gap:22px; }
.col { flex:1; background:#F8F9FB; border:1px solid #E6E8EC; border-radius:18px;
       padding:34px 26px; text-align:center; }
.who { display:inline-block; background:#16181D; color:#fff; border-radius:100px;
       padding:10px 24px; font-size:24px; font-weight:800; margin-bottom:22px; }
.say { font-size:23px; line-height:1.65; color:#38404D; min-height:120px; }
.say b { color:#020817; }
.verdict { margin-top:22px; padding-top:22px; border-top:1px dashed #D8DCE3; }
.x { display:inline-flex; align-items:center; gap:10px; color:#CE2B37;
     font-size:23px; font-weight:800; }
.x::before { content:"✕"; font-size:26px; }
.bottom { margin-top:38px; text-align:center; background:#FFF1F1; border-radius:14px;
          padding:24px; font-size:28px; font-weight:800; color:#CE2B37; letter-spacing:-0.02em; }
</style></head><body><div class="wrap">
<div class="cols">
  <div class="col"><div class="who">유튜버</div>
    <div class="say">같은 종목을 두고<br><b>한쪽은 사라,<br>한쪽은 팔라</b> 합니다</div>
    <div class="verdict"><span class="x">책임지지 않는다</span></div></div>
  <div class="col"><div class="who">증권사</div>
    <div class="say">리포트는 나오지만<br><b>그것만 믿고</b><br>사지는 못합니다</div>
    <div class="verdict"><span class="x">확신을 못 준다</span></div></div>
  <div class="col"><div class="who">AI</div>
    <div class="say">재무 데이터를<br>볼 권한이 없어<br><b>없으면 지어냅니다</b></div>
    <div class="verdict"><span class="x">숫자를 못 믿는다</span></div></div>
</div>
</div></body></html>
