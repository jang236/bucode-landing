<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
       background:#fff; color:#020817; -webkit-font-smoothing:antialiased; }
.wrap { padding:52px 52px 40px; display:flex; gap:22px; }
.panel { flex:1; border-radius:18px; padding:32px 30px; }
.bad { background:#F8F9FB; border:1px solid #E6E8EC; }
.good { background:#FFF9F9; border:2px solid #EF5555; }
.tag { display:inline-flex; align-items:center; gap:9px; font-size:23px; font-weight:800;
       margin-bottom:20px; }
.bad .tag { color:#66707F; } .bad .tag::before { content:"✕"; color:#CE2B37; font-size:25px; }
.good .tag { color:#CE2B37; } .good .tag::before { content:"○"; font-size:25px; }
.tt { font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.4; margin-bottom:24px; }
.chart { height:230px; position:relative; margin-bottom:22px; }
.bars { display:flex; align-items:flex-end; gap:14px; height:200px; padding:0 8px; }
.bar { flex:1; background:#D8DCE3; border-radius:8px 8px 0 0; }
.bar.hero { background:#8B94A3; position:relative; }
.bar.hero::after { content:"좋은 회사"; position:absolute; top:-34px; left:50%; transform:translateX(-50%);
                   font-size:19px; font-weight:700; color:#38404D; white-space:nowrap; }
.avg { position:absolute; left:0; right:0; top:118px; border-top:3px dashed #CE2B37; }
.avg span { position:absolute; right:0; top:-30px; font-size:19px; color:#CE2B37; font-weight:700; }
.band { position:relative; height:230px; }
.rail { position:absolute; left:8px; right:8px; top:104px; height:10px; background:#F0F2F6; border-radius:99px; }
.zone { position:absolute; left:14%; width:52%; top:97px; height:24px;
        background:rgba(31,163,92,.16); border:2px solid #1FA35C; border-radius:99px; }
.zl { position:absolute; top:134px; font-size:19px; color:#66707F; }
.dot { position:absolute; left:20%; top:88px; width:40px; height:40px; border-radius:50%;
       background:#CE2B37; border:5px solid #fff; box-shadow:0 3px 12px rgba(2,8,23,.22); }
.dl { position:absolute; left:20%; top:42px; transform:translateX(-25%); font-size:21px; font-weight:800; color:#CE2B37; white-space:nowrap; }
.res { font-size:22px; line-height:1.6; color:#38404D; padding-top:18px; border-top:1px dashed #D8DCE3; }
.res b { color:#CE2B37; }
</style></head><body><div class="wrap">
  <div class="panel bad">
    <span class="tag">업종 평균과 비교하면</span>
    <div class="tt">좋은 회사는<br>원래 평균보다 비쌉니다</div>
    <div class="chart">
      <div class="bars">
        <div class="bar" style="height:38%"></div>
        <div class="bar" style="height:52%"></div>
        <div class="bar hero" style="height:96%"></div>
        <div class="bar" style="height:45%"></div>
        <div class="bar" style="height:30%"></div>
      </div>
      <div class="avg"><span>업종 평균</span></div>
    </div>
    <div class="res">평균 위에 있다는 이유로 <b>좋은 회사가 전부 걸러집니다</b></div>
  </div>
  <div class="panel good">
    <span class="tag">그 회사의 과거와 비교하면</span>
    <div class="tt">싸진 순간이<br>눈에 보입니다</div>
    <div class="band">
      <div class="rail"></div>
      <div class="zone"></div>
      <div class="zl" style="left:14%">평소 거래되던 PER 범위</div>
      <div class="dot"></div>
      <div class="dl">지금 여기</div>
    </div>
    <div class="res">이익은 느는데 과거보다 낮은 가격 — <b>그때가 기회입니다</b></div>
  </div>
</div></body></html>
