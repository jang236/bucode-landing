<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
       background:#F8F8F8; color:#020817; -webkit-font-smoothing:antialiased; }
.wrap { padding:56px 64px 44px; }
.flow { position:relative; padding-left:70px; }
.rail { position:absolute; left:28px; top:40px; bottom:40px; width:3px; background:#F3C1C1; }
.step { position:relative; background:#fff; border:1px solid #E6E8EC; border-radius:18px;
        padding:30px 34px; margin-bottom:24px; box-shadow:0 3px 14px rgba(2,8,23,.05); }
.step:last-of-type { margin-bottom:0; }
.no { position:absolute; left:-70px; top:28px; width:58px; height:58px; border-radius:50%;
      background:#D93A3A; color:#fff; display:flex; align-items:center; justify-content:center;
      font-size:25px; font-weight:800; box-shadow:0 4px 12px rgba(217,58,58,.3); }
.role { font-size:21px; font-weight:700; color:#8B94A3; margin-bottom:6px; }
.nm { font-size:32px; font-weight:800; letter-spacing:-0.02em; margin-bottom:10px; }
.d { font-size:23px; color:#38404D; line-height:1.65; }
.d b { color:#CE2B37; }
.bottom { margin-top:36px; text-align:center; background:#16181D; color:#fff;
          border-radius:16px; padding:26px; font-size:28px; font-weight:800; letter-spacing:-0.02em; }
.bottom b { color:#FF8F97; }
</style></head><body><div class="wrap">
<div class="flow">
  <div class="rail"></div>
  <div class="step"><div class="no">1</div>
    <div class="role">볼 만한 회사를 추립니다</div>
    <div class="nm">재무 필터링</div>
    <div class="d">2,800개 중 내 기준에 맞는 회사만 남깁니다</div></div>
  <div class="step"><div class="no">2</div>
    <div class="role">좋은 회사인지 봅니다</div>
    <div class="nm">AI 재무분석기</div>
    <div class="d">네이버 증권 데이터 그대로 — <b>추측하지 않습니다</b></div></div>
  <div class="step"><div class="no">3</div>
    <div class="role">지금 사도 되는 가격인지 봅니다</div>
    <div class="nm">적정가 판정</div>
    <div class="d">그 회사의 과거와 비교합니다 — 예측이 아니라 <b>있었던 일</b>로</div></div>
  <div class="step"><div class="no">4</div>
    <div class="role">그 판단이 아직 유효한지 봅니다</div>
    <div class="nm">공시 검증</div>
    <div class="d">유상증자·전환사채가 숫자를 뒤집었는지 확인합니다</div></div>
</div>
<div class="bottom">종목 이름만 넣으면, <b>이 네 단계가 이어집니다</b></div>
</div></body></html>
