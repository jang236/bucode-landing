<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
       background:#fff; color:#020817; -webkit-font-smoothing:antialiased; }
.wrap { padding:52px 56px 44px; }
table { width:100%; border-collapse:separate; border-spacing:0; }
th, td { padding:24px 20px; font-size:25px; text-align:center; }
th { font-size:23px; font-weight:800; }
td.q { text-align:left; font-weight:700; font-size:25px; color:#38404D; }
col.mine { background:#FFF9F9; }
thead th:nth-child(2) { color:#66707F; }
thead th:nth-child(3) { color:#CE2B37; border-top:3px solid #EF5555; border-left:3px solid #EF5555; border-right:3px solid #EF5555; border-radius:16px 16px 0 0; }
tbody td { border-bottom:1px solid #EEF0F4; }
tbody td:nth-child(3) { border-left:3px solid #EF5555; border-right:3px solid #EF5555; font-weight:800; }
tbody tr:last-child td:nth-child(3) { border-bottom:3px solid #EF5555; border-radius:0 0 16px 16px; }
.ok { color:#1FA35C; font-weight:800; }
.no { color:#C3CAD4; font-weight:800; }
.foot { margin-top:30px; text-align:center; font-size:27px; font-weight:800; letter-spacing:-0.02em; }
.foot b { color:#CE2B37; }
</style></head><body><div class="wrap">
<table>
  <colgroup><col style="width:44%"><col style="width:28%"><col class="mine" style="width:28%"></colgroup>
  <thead><tr><th></th><th>보통의 분석 도구</th><th>이 시스템</th></tr></thead>
  <tbody>
    <tr><td class="q">좋은 회사인가?</td><td class="ok">확인</td><td class="ok">확인</td></tr>
    <tr><td class="q">지금 사도 되는 가격인가?</td><td class="no">—</td><td class="ok">확인</td></tr>
    <tr><td class="q">그 판단이 아직 유효한가?</td><td class="no">—</td><td class="ok">확인</td></tr>
  </tbody>
</table>
<p class="foot">도구들이 멈추는 지점, <b>그 뒤부터가 판단입니다</b></p>
</div></body></html>
